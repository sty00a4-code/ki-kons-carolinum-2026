[project]
name = "projekt1-curriculum-mapping"
version = "1.0.0"
description = "Prüfziele den Lernzielen zuordnen und Vorlesungen mit Lernzielen oder Prüfzielen abgleichen"
readme = "README.md"
requires-python = ">=3.11"
# Feste Versionen für den Betrieb stehen in requirements.txt.
dependencies = [
    "Flask>=3.1",
    "openpyxl>=3.1",
    "pillow>=13.0",
    "pypdf>=6.21.4",
    "pypdfium2>=5.0",
    "requests>=2.32",
    "Werkzeug>=3.1.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E",
    "ERA",
    "F",
    "FBT",
    "I",
    "ISC",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T20",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "N818",    # Ausnahmeklassen enden auf "Fehler"
    "PLR0913", # optionale Parameter sind keyword-only (PLR0917 bleibt aktiv)
    "PLR2004", # Schwellenwerte stehen direkt im Vergleich
    "TRY003",  # Fehlermeldungen werden in der Oberfläche angezeigt
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]
# pytest prüft mit assert, die Passwörter sind Testwerte
"tests/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["app", "scripts", "tests"]

[[tool.mypy.overrides]]
# pypdfium2 bringt keine Typangaben mit.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app", "scripts"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
fail_under = 95
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]

[tool.vulture]
paths = ["app", "scripts"]
min_confidence = 80

[tool.djlint]
profile = "jinja"
ignore = "H021" # Breite der Fortschrittsbalken als Inline-Style
